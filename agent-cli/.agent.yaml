# Options: claude-haiku-4-5-20251001 (anthropic) | meta-llama/llama-4-scout-17b-16e-instruct (groq) | deepseek-chat (deepseek) | sarvam-105b (sarvam) 
# | gemini-2.5-pro |nvidia/nemotron-3-ultra-550b-a55b:free | xiaomi/mimo-v2.6-pro
model: nvidia/nemotron-3-ultra-550b-a55b

# LLM provider to use — matches a file in the providers/ folder
# Options: anthropic | groq | deepseek | openrouter | together | openai | sarvam | google
provider: openrouter

# Maximum tool calls per task before raising an error
max_tool_calls: 100

# Maximum tool calls allowed during the shutdown / save sequence
max_shutdown_calls: 5

# Path to the SQLite database file (relative to agent-cli/)
db_path: memory/sessions.db

# path to the vectorDB 
vector_db_path: memory/

# Path to the project notes file (relative to agent-cli/)
project_notes: memory/AGENT.md

# Maximum tokens for the initial LLM response
max_tokens: 4096

# Maximum tokens for tool-use continuation responses
max_tokens_tool: 10000

# is used to limit the context reaching limit
max_history_calls: 10

planner_provider: google   # or openrouter / vertex depending on your proxy setup

planner_model: gemini-3.5-flash-lite

github_user: jagadeesh-sagar
